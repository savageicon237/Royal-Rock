<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Royal Rock</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f0f1a;
            color: white;
        }
        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
            border-right: 1px solid rgba(201,160,61,0.3);
            padding: 20px;
        }
        .sidebar-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .sidebar-header h2 {
            color: #c9a03d;
        }
        .sidebar-nav {
            list-style: none;
        }
        .sidebar-nav li {
            margin-bottom: 10px;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }
        .sidebar-nav a:hover, .sidebar-nav a.active {
            background: rgba(201,160,61,0.2);
            color: #c9a03d;
        }
        .logout-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(239,68,68,0.2);
            color: #ef4444;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        .stat-card i {
            font-size: 2rem;
            color: #c9a03d;
        }
        .stat-card h3 {
            font-size: 1.8rem;
            margin: 10px 0;
        }
        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            overflow: hidden;
        }
        .product-image {
            height: 180px;
            overflow: hidden;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            padding: 15px;
        }
        .product-actions {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .btn-edit, .btn-delete {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-edit {
            background: rgba(34,197,94,0.2);
            color: #22c55e;
        }
        .btn-delete {
            background: rgba(239,68,68,0.2);
            color: #ef4444;
        }
        .btn-add {
            background: #c9a03d;
            color: #1a1a2e;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
        }
        .btn-save {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #c9a03d, #ffd700);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-weight: 600;
            cursor: pointer;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .upload-area {
            border: 2px dashed rgba(201,160,61,0.5);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
        }
        .image-preview {
            margin-top: 10px;
            text-align: center;
        }
        .image-preview img {
            max-width: 100px;
            border-radius: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            color: #c9a03d;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }
            .sidebar-header h2, .sidebar-nav a span {
                display: none;
            }
            .main-content {
                margin-left: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Royal Rock</h2>
            <p>Admin</p>
        </div>
        <ul class="sidebar-nav">
            <li><a href="#" class="active" data-section="dashboard"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
            <li><a href="#" data-section="products"><i class="fas fa-box"></i> <span>Products</span></a></li>
            <li><a href="#" data-section="affiliates"><i class="fas fa-users"></i> <span>Affiliates</span></a></li>
            <li><a href="#" data-section="settings"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
        </ul>
        <a href="#" class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 id="pageTitle">Dashboard</h1>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="section active">
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-box"></i>
                    <h3 id="totalProducts">0</h3>
                    <p>Products</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-users"></i>
                    <h3 id="totalAffiliates">0</h3>
                    <p>Affiliates</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-dollar-sign"></i>
                    <h3 id="totalSales">0</h3>
                    <p>Total Sales (CFA)</p>
                </div>
            </div>
        </div>

        <!-- Products Management -->
        <div id="products" class="section">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h2>Manage Products</h2>
                <button class="btn-add" onclick="openAddProductModal()"><i class="fas fa-plus"></i> Add Product</button>
            </div>
            <div class="products-grid" id="productsGrid"></div>
        </div>

        <!-- Affiliates Management -->
        <div id="affiliates" class="section">
            <h2>Affiliates</h2>
            <div style="overflow-x: auto;">
                <table id="affiliatesTable">
                    <thead>
                        <tr><th>Name</th><th>Email</th><th>Referral Code</th><th>Earnings</th><th>Joined</th></tr>
                    </thead>
                    <tbody id="affiliatesList"></tbody>
                </table>
            </div>
        </div>

        <!-- Settings -->
        <div id="settings" class="section">
            <h2>Commission Settings</h2>
            <div style="background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px;">
                <form id="commissionForm">
                    <div class="form-group">
                        <label>Level 1 Commission (%)</label>
                        <input type="number" id="level1Comm" value="12" step="0.5">
                    </div>
                    <div class="form-group">
                        <label>Level 2 Commission (%)</label>
                        <input type="number" id="level2Comm" value="6" step="0.5">
                    </div>
                    <div class="form-group">
                        <label>Level 3 Commission (%)</label>
                        <input type="number" id="level3Comm" value="3" step="0.5">
                    </div>
                    <div class="form-group">
                        <label>Level 4 Commission (%)</label>
                        <input type="number" id="level4Comm" value="1" step="0.5">
                    </div>
                    <button type="submit" class="btn-save">Save Changes</button>
                </form>
            </div>
            <div style="background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; margin-top: 20px;">
                <h3>Change Admin Password</h3>
                <form id="passwordForm">
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="newPassword" required>
                    </div>
                    <button type="submit" class="btn-save">Update Password</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add Product</h3>
                <button onclick="closeModal()" style="background:none; border:none; color:white; font-size:1.5rem;">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="productCategory">
                        <option value="herbal">Herbal Products</option>
                        <option value="restaurant">Restaurant</option>
                        <option value="medical">Medical Equipment</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (CFA)</label>
                    <input type="number" id="productPrice" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="productDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Product Image</label>
                    <div class="upload-area" onclick="document.getElementById('imageFile').click()">
                        <i class="fas fa-cloud-upload-alt"></i> Click to upload
                    </div>
                    <input type="file" id="imageFile" style="display:none" accept="image/*">
                    <div class="image-preview" id="imagePreview"></div>
                </div>
                <div class="form-group">
                    <label>Stock</label>
                    <select id="productStock">
                        <option value="true">In Stock</option>
                        <option value="false">Out of Stock</option>
                    </select>
                </div>
                <button type="submit" class="btn-save">Save Product</button>
            </form>
        </div>
    </div>

    <script>
        // Check admin session
        function checkAdmin() {
            const isLoggedIn = localStorage.getItem('adminLoggedIn');
            const expiry = localStorage.getItem('adminSessionExpiry');
            if (!isLoggedIn || !expiry || Date.now() > parseInt(expiry)) {
                window.location.href = 'admin.html';
            }
        }
        checkAdmin();

        // Initialize products
        function initProducts() {
            if (!localStorage.getItem('royalRockProducts')) {
                const defaultProducts = [
                    { id: 1, name: "Immune Boost Complex", category: "herbal", price: 35000, description: "Natural immune system support", image: "images/herbal1.jpg", stock: true },
                    { id: 2, name: "Detox Wellness Tea", category: "herbal", price: 25000, description: "Organic detox tea", image: "images/herbal2.jpg", stock: true },
                    { id: 3, name: "Energy Capsules", category: "herbal", price: 40000, description: "Natural energy boost", image: "images/herbal3.jpg", stock: true }
                ];
                localStorage.setItem('royalRockProducts', JSON.stringify(defaultProducts));
            }
        }
        initProducts();

        function getProducts() {
            return JSON.parse(localStorage.getItem('royalRockProducts') || '[]');
        }

        function saveProducts(products) {
            localStorage.setItem('royalRockProducts', JSON.stringify(products));
            loadProducts();
            updateStats();
        }

        function loadProducts() {
            const products = getProducts();
            const container = document.getElementById('productsGrid');
            if (!container) return;
            
            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        <img src="${product.image}" alt="${product.name}" onerror="this.src='https://placehold.co/300x180/1a1a2e/c9a03d?text=No+Image'">
                    </div>
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <p style="color:#c9a03d;">${product.price.toLocaleString()} CFA</p>
                        <p style="font-size:0.8rem;">${product.description.substring(0, 60)}...</p>
                    </div>
                    <div class="product-actions">
                        <button class="btn-edit" onclick="editProduct(${product.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteProduct(${product.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function editProduct(id) {
            const products = getProducts();
            const product = products.find(p => p.id === id);
            if (!product) return;
            
            document.getElementById('productId').value = product.id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productCategory').value = product.category;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productDescription').value = product.description;
            document.getElementById('productStock').value = product.stock ? 'true' : 'false';
            document.getElementById('modalTitle').innerText = 'Edit Product';
            document.getElementById('productModal').classList.add('active');
        }

        function deleteProduct(id) {
            if (confirm('Delete this product?')) {
                let products = getProducts();
                products = products.filter(p => p.id !== id);
                saveProducts(products);
                loadProducts();
                updateStats();
            }
        }

        // Image upload
        document.getElementById('imageFile')?.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('imagePreview').innerHTML = `<img src="${event.target.result}" style="max-width:100px;">`;
                    window.tempImage = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Product form submit
        document.getElementById('productForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            let products = getProducts();
            const id = parseInt(document.getElementById('productId').value) || Date.now();
            const name = document.getElementById('productName').value;
            const category = document.getElementById('productCategory').value;
            const price = parseInt(document.getElementById('productPrice').value);
            const description = document.getElementById('productDescription').value;
            const stock = document.getElementById('productStock').value === 'true';
            const image = window.tempImage || (products.find(p => p.id === id)?.image || `images/${category}1.jpg`);
            
            const existingIndex = products.findIndex(p => p.id === id);
            const newProduct = { id, name, category, price, description, image, stock };
            
            if (existingIndex !== -1) {
                products[existingIndex] = newProduct;
            } else {
                products.push(newProduct);
            }
            
            saveProducts(products);
            closeModal();
            loadProducts();
            updateStats();
            alert('Product saved! Affiliate page will update automatically.');
        });

        function openAddProductModal() {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('modalTitle').innerText = 'Add Product';
            document.getElementById('imagePreview').innerHTML = '';
            window.tempImage = null;
            document.getElementById('productModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        function updateStats() {
            const products = getProducts();
            const affiliates = JSON.parse(localStorage.getItem('localUsers') || '[]');
            document.getElementById('totalProducts').innerText = products.length;
            document.getElementById('totalAffiliates').innerText = affiliates.filter(u => u.has_purchased).length;
        }

        // Load affiliates
        function loadAffiliates() {
            const users = JSON.parse(localStorage.getItem('localUsers') || '[]');
            const affiliates = JSON.parse(localStorage.getItem('localAffiliates') || '[]');
            const tbody = document.getElementById('affiliatesList');
            if (tbody) {
                tbody.innerHTML = users.map(user => {
                    const affiliate = affiliates.find(a => a.id === user.id);
                    return `
                        <tr>
                            <td>${user.full_name}</td>
                            <td>${user.email}</td>
                            <td style="color:#c9a03d;">${user.referral_code}</td>
                            <td>${affiliate?.total_earnings?.toLocaleString() || 0} CFA</td>
                            <td>${new Date(user.created_at).toLocaleDateString()}</td>
                        </tr>
                    `;
                }).join('');
            }
        }

        // Navigation
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const section = link.dataset.section;
                document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
                link.classList.add('active');
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById(section).classList.add('active');
                document.getElementById('pageTitle').innerText = link.querySelector('span')?.innerText || section;
                
                if (section === 'affiliates') loadAffiliates();
                if (section === 'products') loadProducts();
            });
        });

        // Logout
        document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminSessionExpiry');
            window.location.href = 'admin.html';
        });

        // Commission settings
        document.getElementById('commissionForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const rates = {
                level1: parseFloat(document.getElementById('level1Comm').value),
                level2: parseFloat(document.getElementById('level2Comm').value),
                level3: parseFloat(document.getElementById('level3Comm').value),
                level4: parseFloat(document.getElementById('level4Comm').value)
            };
            localStorage.setItem('commissionRates', JSON.stringify(rates));
            alert('Commission rates saved!');
        });

        // Password change
        document.getElementById('passwordForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            if (newPass.length < 4) {
                alert('Password must be at least 4 characters');
                return;
            }
            alert('Password updated! (Store this in your database)');
        });

        // Load initial data
        loadProducts();
        updateStats();
    </script>
</body>
</html>
