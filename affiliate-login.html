</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <h1>ROYAL ROCK <span></span></h1>
            <p>Est. 2020</p>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="affiliate.html">🌿 Herbal Affiliate</a>
            <a href="restaurant.html">🍽️ Royal Rock Dining</a>

                <i class="fas fa-bars"></i>

        <a href="index.html">Home</a>

<section class="login-section reveal">
    <div class="container">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <i class="fas fa-user-circle"></i>
                    <h1>Affiliate Login</h1>
                    <p>Welcome back! Please login to your account</p>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Username or Email</label>
                        <input type="text" id="loginUsername" placeholder="Enter your username or email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="rememberMe">
                        <label>Remember me (30 days)</label>
                    </div>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
                <div id="loginStatus"></div>
                <div class="login-footer">
                    <a href="#">Forgot Password?</a>
                    <a href="affiliate-register.html">Create Account</a>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
